<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class Schedule Calendar</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    h1 { margin-bottom: 10px; }

    .calendar-container {
      background: white;
      border-radius: 15px;
      padding: 20px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    button {
      background: #2196F3;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .month-year {
      font-size: 22px;
      font-weight: bold;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 10px;
    }

    .weekday {
      text-align: center;
      font-weight: bold;
      color: #2196F3;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }

    .day-box {
      background: #f9f9f9;
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      min-height: 110px;

      min-width: 0;
      overflow: hidden;
    }

    .day-box.today {
      border: 3px solid #2196F3;
      background: #e3f2fd;
    }

    .day-box.other-month {
      opacity: 0.4;
    }

    .day-number {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .class-event {
      font-size: 11px;
      margin-bottom: 3px;
      padding: 3px;
      border-radius: 4px;
      color: white;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .class1 { background: #667eea; }
    .class5 { background: #f5576c; }

    .holiday {
      background: #ffcc33;
      color: black;
      font-weight: bold;
    }

  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>📚 Class Schedule Calendar</h1>
  </header>

  <div class="calendar-container">

    <div class="calendar-header">
      <button onclick="previousMonth()">← Previous</button>
      <div class="month-year" id="monthYear"></div>
      <button onclick="nextMonth()">Next →</button>
    </div>

    <div class="weekdays">
      <div class="weekday">Sun</div>
      <div class="weekday">Mon</div>
      <div class="weekday">Tue</div>
      <div class="weekday">Wed</div>
      <div class="weekday">Thu</div>
      <div class="weekday">Fri</div>
      <div class="weekday">Sat</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

  </div>
</div>

<script>

const today = new Date();
let currentMonth = today.getMonth();
let currentYear = today.getFullYear();

/* CLASS STRUCTURE */
const classTemplate = {
  class1day: ["Class 1","Class 2","Class 3","Class 4"],
  class5day: ["Class 5","Class 6","Class 7","Class 8"],
  saturday: ["Saturday Classes"]
};

/* HOLIDAYS */
const publicHolidays = {
  '2026-03-21': "Human Rights Day",
  '2026-04-27': "Freedom Day",
  '2026-12-25': "Christmas Day"
};

/* ROTATION RESET */
const rotationRules = [
  { start: '2026-02-16', type: 'class5' },
  { start: '2027-01-04', type: 'class1' }
];

function getRule(dateStr){
  let active = rotationRules[0];
  rotationRules.forEach(r=>{
    if(dateStr >= r.start) active = r;
  });
  return active;
}

function weeksBetween(start, current){
  const s = new Date(start);
  const c = new Date(current);
  return Math.floor((c - s) / (7*24*60*60*1000));
}

function getClasses(dateStr){

  if(publicHolidays[dateStr]) return [];

  const d = new Date(dateStr);
  const day = d.getDay();

  if(day===0) return [];
  if(day===6) return classTemplate.saturday;

  const rule = getRule(dateStr);
  const evenWeek = weeksBetween(rule.start, dateStr) % 2 === 0;

  let mwf = rule.type;
  if(!evenWeek) mwf = (mwf==='class1') ? 'class5':'class1';

  const tt = (mwf==='class1') ? 'class5':'class1';

  const isMWF = [1,3,5].includes(day);

  return isMWF ? classTemplate[mwf+'day'] : classTemplate[tt+'day'];
}

/* CALENDAR */
function renderCalendar(){

  const grid = document.getElementById("calendarGrid");
  const title = document.getElementById("monthYear");

  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  title.textContent = months[currentMonth] + " " + currentYear;

  grid.innerHTML = "";

  const firstDay = new Date(currentYear,currentMonth,1).getDay();
  const daysInMonth = new Date(currentYear,currentMonth+1,0).getDate();

  for(let i=0;i<firstDay;i++){
    grid.appendChild(createBox("",true));
  }

  for(let d=1; d<=daysInMonth; d++){

    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const box = createBox(d,false,dateStr);

    grid.appendChild(box);
  }

}

/* DAY BOX */
function createBox(day,other,dateStr=null){

  const div = document.createElement("div");
  div.className="day-box";

  if(other) div.classList.add("other-month");

  if(dateStr){
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    if(dateStr===todayStr) div.classList.add("today");
  }

  const num = document.createElement("div");
  num.className="day-number";
  num.textContent=day;
  div.appendChild(num);

  if(dateStr){

    const classes = getClasses(dateStr);

    classes.forEach(c=>{
      const el=document.createElement("div");
      el.className="class-event "+(c.includes("1")?"class1":"class5");
      el.textContent=c;
      div.appendChild(el);
    });

    if(publicHolidays[dateStr]){
      const el=document.createElement("div");
      el.className="class-event holiday";
      el.textContent="🎉 "+publicHolidays[dateStr];
      div.appendChild(el);
    }
  }

  return div;
}

function previousMonth(){
  currentMonth--;
  if(currentMonth<0){ currentMonth=11; currentYear--; }
  renderCalendar();
}

function nextMonth(){
  currentMonth++;
  if(currentMonth>11){ currentMonth=0; currentYear++; }
  renderCalendar();
}

renderCalendar();

</script>

</body>
</html>
